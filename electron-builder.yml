appId: net.yondertech.yonderpdf
productName: Yonder PDF
copyright: Copyright © 2026 Yonder Tech
directories:
  buildResources: build
  output: release
files:
  - out/**
  - resources/**
  - package.json
asar: true
asarUnpack:
  - resources/**
fileAssociations:
  - ext: pdf
    name: PDF Document
    description: Portable Document Format
    role: Editor
    mimeType: application/pdf
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  identity: 'Yondertech Inc (C29K99D3D3)'
dmg:
  contents:
    - { x: 130, y: 220 }
    - { x: 410, y: 220, type: link, path: /Applications }
win:
  target:
    - target: nsis
      arch: [x64, arm64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
linux:
  category: Office
  target: [AppImage, deb]
  maintainer: Yonder Tech <admin@yondertech.net>
publish:
  provider: github
  owner: yondertech-admin
  repo: yonder-pdf
  releaseType: release
