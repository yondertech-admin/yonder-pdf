<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP (design §12 / finding 22). The ad host is the only remote origin and it
      is confined to frame-src. pdf.js needs blob: workers and data:/blob: images
      and fonts; its layers set inline styles.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; worker-src 'self' blob:; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-src https://yondertech.net; connect-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Yonder PDF</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
